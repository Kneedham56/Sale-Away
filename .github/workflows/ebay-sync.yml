# Pulls new eBay orders and fees every 15 minutes (Vercel's free plan only allows a daily cron).
# Needs repository secrets APP_URL (e.g. https://sale-away.vercel.app) and CRON_SECRET (same value as on Vercel).
name: eBay sync
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:
jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - name: Call sync endpoint
        env:
          APP_URL: ${{ secrets.APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$APP_URL" ] || [ -z "$CRON_SECRET" ]; then echo "Secrets not set; skipping."; exit 0; fi
          curl -sS --fail-with-body --max-time 320 -H "Authorization: Bearer $CRON_SECRET" "$APP_URL/api/cron/ebay-sync"
